version: "3.9"

# AI Voice Receptionist — Infrastructure Services
# Run with: podman-compose up -d
#
# What runs here (containerized logic/state):
#   - Redis        Short-term session memory
#   - Qdrant       Long-term knowledge / RAG (phase 2)
#   - Speaches     GPU-accelerated Faster-Whisper STT
#
# What runs NATIVELY on Windows (for GPU/latency reasons):
#   - Ollama       LLM inference  (ollama run llama3:8b)
#   - Kokoro TTS   Voice synthesis (python scripts/kokoro_server.py)

services:

  # -------------------------------------------------------------------------
  # Short-Term Session Memory
  # -------------------------------------------------------------------------
  redis:
    image: docker.io/redis:7-alpine
    container_name: receptionist-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # Long-Term Knowledge Store (Qdrant for RAG — activate in Phase 2)
  # -------------------------------------------------------------------------
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: receptionist-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # Speech-to-Text (Faster-Whisper, GPU-accelerated)
  # Requires NVIDIA Container Toolkit for Podman.
  # See: scripts/setup_gpu_podman.ps1 for Windows setup.
  #
  # GPU NOTE: podman-compose does NOT support Docker Swarm's `deploy.resources`
  # for GPU passthrough. Use the CDI device annotation below instead.
  # After running setup_gpu_podman.ps1, verify CDI with:
  #   podman run --rm --device nvidia.com/gpu=all nvidia/cuda:12.0-base nvidia-smi
  # -------------------------------------------------------------------------
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    container_name: receptionist-stt
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=Systran/faster-whisper-medium
      - DEVICE=cuda
      - COMPUTE_TYPE=float16
    volumes:
      - speaches_models:/root/.cache/huggingface
    restart: unless-stopped
    # GPU passthrough via CDI (Container Device Interface) — Podman native way.
    # This is equivalent to --device nvidia.com/gpu=all on the podman CLI.
    # Requires: nvidia-container-toolkit >= 1.14 with CDI enabled.
    devices:
      - nvidia.com/gpu=all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s  # Model download can take a while on first run

volumes:
  redis_data:
  qdrant_storage:
  speaches_models:   # Persists downloaded Whisper model weights

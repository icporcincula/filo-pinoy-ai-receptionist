version: "3.9"

# Starts: Redis (history) + Speaches (Whisper STT, GPU) + Qdrant (RAG) + n8n (Workflow)
# Run: docker compose up -d
#
# Ollama and Kokoro run natively on Windows (not here).

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning

  speaches:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WHISPER__MODEL: Systman/faster-whisper-small
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__MODEL_TTL: 0
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    
  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_EXTERNAL_FRONTEND_HOST=localhost
      - N8N_EXTERNAL_FRONTEND_PORT=5678

volumes:
  redis-data:
  qdrant_data:
